[workspace]
resolver = "2"
members = [
    "contracts/policy-view-helper",
]

[workspace.package]
authors = ["SpendGuard Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/spendguard/spendguard-contract"
keywords = ["stellar", "soroban", "smart-contracts", "spending-limits"]
version = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "27.0.3", features = ["experimental_spec_shaking_v2"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
